name: build i deploy na Pages

# Sprawdzenia lecą na każdym pull requeście, deploy wyłącznie po scaleniu do `main`.
# Gałęzie robocze nie mają własnego wdrożenia: strona pod adresem Pages ma pokazywać
# to, co zostało przyjęte, a nie ostatnią rzecz, którą ktoś wypchnął.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Sprawdzenia anulują się nawzajem w obrębie tego samego pull requesta — nowy push
# unieważnia poprzedni. Deploy ma własną grupę i NIE jest anulowany: jedna grupa dla
# obu zadań oznaczałaby, że kolejny przebieg ubija trwające wdrożenie.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reguła ESLint pilnuje dwóch rzeczy, które inaczej wychodzą na jaw dopiero
      # po miesiącach: kodów języków poza adapterami i kolorów poza warstwą motywu.
      - name: ESLint
        run: npm run lint

      # Bramka kontrastu z sekcji 9.1 planu — preset łamiący AA nie wchodzi do repo.
      # Do tego testy silnika SRS: sekcja 16 wymaga pokrycia logiki powtórek.
      - name: Testy
        run: npm test

      - name: Build
        run: npm run build
        env:
          NABU_BASE: /${{ github.event.repository.name }}/

      # Artefakt powstaje tylko dla `main` — z pull requesta nie ma czego wdrażać.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
